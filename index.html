<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar en Criollo</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #060811;
    --bg-panel: #0d1120;
    --bg-panel-2: #121729;
    --line: #232a44;
    --ink: #edf1fb;
    --ink-dim: #97a1c2;
    --ink-faint: #5c6588;
    --cyan: #2fe6c9;
    --cyan-dim: #17a893;
    --magenta: #ff5fd0;
    --gold: #ffcf6e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }

  body {
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .mono {
    font-family: "Space Mono", ui-monospace, "SF Mono", monospace;
  }

  /* ---------- deck chrome ---------- */

  .deck {
    position: relative;
    width: 100%;
    height: 100dvh;
    background:
      radial-gradient(circle at 14% 18%, rgba(47,230,201,0.10), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(255,95,208,0.09), transparent 46%),
      var(--bg);
  }

  .railtrack {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--line);
    z-index: 5;
  }
  .rail {
    height: 100%;
    background: linear-gradient(90deg, var(--magenta), var(--cyan) 45%, var(--gold) 80%, var(--magenta));
    background-size: 220% 100%;
    animation: railmove 7s linear infinite;
    width: 0%;
    transition: width .4s ease;
  }
  @keyframes railmove { from { background-position: 0 0; } to { background-position: -220% 0; } }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: 7vh 9vw 9vh;
  }
  .slide.active { display: flex; }

  .eyebrow {
    font-family: "Space Mono", monospace;
    text-transform: uppercase;
    letter-spacing: .16em;
    font-size: clamp(.7rem, 1vw, .85rem);
    color: var(--cyan);
    margin: 0 0 1.4rem;
  }
  .eyebrow.magenta { color: var(--magenta); }
  .eyebrow.gold { color: var(--gold); }

  h1.title {
    font-size: clamp(2.2rem, 5.2vw, 4.4rem);
    line-height: 1.05;
    margin: 0 0 1.1rem;
    text-wrap: balance;
    font-weight: 700;
  }
  h2.title { font-size: clamp(1.7rem, 3.6vw, 3rem); line-height: 1.1; margin: 0 0 1rem; text-wrap: balance; font-weight: 700; }

  p.lede {
    font-size: clamp(1.05rem, 1.7vw, 1.5rem);
    line-height: 1.55;
    color: var(--ink-dim);
    max-width: 46ch;
    margin: 0;
  }

  .accent { color: var(--cyan); }
  .accent-m { color: var(--magenta); }
  .accent-g { color: var(--gold); }

  /* ---------- reusable pieces ---------- */

  .bignum {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: clamp(3rem, 7vw, 6rem);
    line-height: 1;
    color: var(--cyan);
    margin-bottom: .6rem;
  }

  .rowset {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 1.1rem;
    margin-top: 2.2rem;
    max-width: 1100px;
  }
  .ledger-card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1.3rem 1.4rem;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .ledger-card .name {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: clamp(1rem, 1.3vw, 1.2rem);
    color: var(--ink);
  }
  .ledger-card .desc {
    font-size: clamp(.85rem, 1.05vw, 1rem);
    color: var(--ink-dim);
    line-height: 1.45;
  }

  .split {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 4vw;
    align-items: center;
    max-width: 1200px;
  }

  .diagram {
    position: relative;
    aspect-ratio: 1 / 1;
    max-width: 380px;
    justify-self: center;
  }

  .pause-slide {
    align-items: center;
    text-align: center;
  }
  .pause-slide .bignum { color: var(--gold); }
  .pause-slide h2 { max-width: 30ch; margin-left: auto; margin-right: auto; }

  .qcard {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1rem 1.1rem;
    max-width: 480px;
  }
  .qcard .bar {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--magenta), var(--cyan) 60%, var(--gold));
    margin-bottom: .8rem;
  }
  .qcard .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:.55rem; }
  .qcard .brand { font-family:"Space Mono",monospace; font-weight:700; font-size:.85rem; }
  .qcard .brand span { color: var(--cyan); }
  .qcard .pill { font-family:"Space Mono",monospace; font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; background: rgba(47,230,201,0.12); color: var(--cyan); padding:.2rem .5rem; border-radius:2px; }
  .qcard .questline { border:1px solid var(--line); background:var(--bg-panel-2); padding:.6rem .7rem; border-radius:4px; display:flex; justify-content:space-between; align-items:center; font-size:.78rem; color: var(--ink-dim); }
  .qcard .questline b { color: var(--ink); font-weight: 600; }
  .qcard .questline em { font-style: normal; color: var(--cyan); font-family:"Space Mono",monospace; font-size:.68rem; }

  .keytakes { display:flex; flex-direction:column; gap: 1rem; margin-top: 1.8rem; max-width: 640px; }
  .keytakes .kt { display:flex; gap: 1rem; align-items:flex-start; }
  .keytakes .kt .n { font-family:"Space Mono",monospace; font-weight:700; color: var(--magenta); font-size: 1.1rem; min-width: 1.6rem; }
  .keytakes .kt .t { font-size: clamp(1rem, 1.4vw, 1.2rem); color: var(--ink); line-height:1.4; }

  /* nav + footer */
  .navhint {
    position: absolute;
    bottom: 2.2vh; left: 9vw;
    font-family: "Space Mono", monospace;
    font-size: .7rem;
    color: var(--ink-faint);
    letter-spacing: .04em;
    z-index: 5;
  }
  .counter {
    position: absolute;
    bottom: 2.2vh; right: 9vw;
    font-family: "Space Mono", monospace;
    font-size: .78rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    z-index: 5;
  }
  .counter .now { color: var(--cyan); }

  .arrows { position:absolute; top:0; bottom:0; width:14%; z-index:6; cursor:pointer; }
  .arrows.left { left:0; } .arrows.right { right:0; }

  .planet {
    position: absolute;
    border-radius: 50%;
    filter: blur(0px);
    opacity: .5;
    z-index: 0;
  }

  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .rail { animation: none; background-position: 0 0; }
  }

  .qtag {
    display: inline-block;
    align-self: flex-start;
    width: fit-content;
    font-family: "Space Mono", monospace;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .14em;
    padding: .32rem .75rem;
    border-radius: 3px;
    margin-bottom: 1.3rem;
  }
  .qtag.q { background: rgba(47,230,201,0.13); color: var(--cyan); }
  .qtag.a { background: rgba(255,207,110,0.15); color: var(--gold); }

  .codebox {
    font-family: "Space Mono", monospace;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.1rem 1.3rem;
    color: var(--cyan);
    font-size: clamp(.82rem, 1.15vw, 1.02rem);
    max-width: 640px;
    margin-top: 1.6rem;
    line-height: 1.8;
    white-space: pre-wrap;
  }

  .speaker {
    margin-top: 2.4rem;
    padding-top: 1.4rem;
    border-top: 1px solid var(--line);
    max-width: 46ch;
  }
  .speaker .name {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: clamp(1rem, 1.3vw, 1.15rem);
    color: var(--ink);
    margin-bottom: .3rem;
  }
  .speaker .tags {
    font-family: "Space Mono", monospace;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--ink-faint);
  }

  .callout {
    margin-top: 1.5rem;
    padding: 1rem 1.3rem;
    border-left: 3px solid var(--cyan);
    background: var(--bg-panel);
    font-size: clamp(1.05rem, 1.5vw, 1.3rem);
    color: var(--ink);
    max-width: 44ch;
    line-height: 1.45;
  }

  .linkrow {
    display: flex;
    gap: 1rem;
    margin-top: 2.2rem;
    flex-wrap: wrap;
  }
  .linkrow .link {
    font-family: "Space Mono", monospace;
    font-size: clamp(.88rem, 1.05vw, 1.02rem);
    color: var(--ink);
    border: 1px solid var(--line);
    background: var(--bg-panel);
    padding: .6rem 1rem;
    border-radius: 4px;
  }
  .linkrow .link span { color: var(--cyan); }

  .flowchart {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .4rem;
    justify-self: center;
  }
  .fbox {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: 1.1rem;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1rem 2rem;
    color: var(--ink);
    min-width: 220px;
    text-align: center;
  }
  .fbox.accent-border { border-color: var(--cyan); color: var(--cyan); }
  .farrow { color: var(--ink-faint); font-size: 1.3rem; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">

// ---------- engine ----------
let i = 0;
const stage = document.getElementById("stage");
slides.forEach((s, idx) => {
  const el = document.createElement("div");
  el.className = "slide" + (s.pause ? " pause-slide" : "");
  el.innerHTML = s.html;
  el.dataset.idx = idx;
  stage.appendChild(el);
});
document.getElementById("ctotal").textContent = String(slides.length).padStart(2,"0");

function render() {
  document.querySelectorAll(".slide").forEach((el,idx) => {
    el.classList.toggle("active", idx === i);
  });
  document.getElementById("cnow").textContent = String(i+1).padStart(2,"0");
  document.getElementById("rail").style.width = (((i+1)/slides.length)*100) + "%";
}
function go(d) {
  i = Math.min(slides.length-1, Math.max(0, i+d));
  render();
}
window.addEventListener("keydown", (e) => {
  if (["ArrowRight","PageDown"," "].includes(e.key)) { go(1); e.preventDefault(); }
  if (["ArrowLeft","PageUp"].includes(e.key)) { go(-1); e.preventDefault(); }
});
render();

// decorative ledger diagram (canvas, no hand-authored SVG paths)
(function () {
  const host = document.getElementById("ledger-diagram");
  if (!host) return;
  const canvas = document.createElement("canvas");
  canvas.style.width = "100%";
  canvas.style.height = "100%";
  host.appendChild(canvas);
  const dpr = window.devicePixelRatio || 1;
  const size = 380;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  const nodes = [
    [190,60],[320,140],[300,290],[150,330],[45,240],[55,110],[190,190]
  ];
  ctx.strokeStyle = "rgba(151,161,194,0.35)";
  ctx.lineWidth = 1;
  for (let a = 0; a < nodes.length; a++) {
    for (let b = a+1; b < nodes.length; b++) {
      ctx.beginPath();
      ctx.moveTo(nodes[a][0], nodes[a][1]);
      ctx.lineTo(nodes[b][0], nodes[b][1]);
      ctx.stroke();
    }
  }
  nodes.forEach(([x,y], idx) => {
    const isCenter = idx === nodes.length - 1;
    ctx.beginPath();
    ctx.arc(x, y, isCenter ? 10 : 7, 0, Math.PI*2);
    ctx.fillStyle = isCenter ? "#ffcf6e" : (idx % 2 === 0 ? "#2fe6c9" : "#ff5fd0");
    ctx.fill();
  });
})();
</script>
</body>
